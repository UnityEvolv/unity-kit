name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerates the token files and fails if the result differs from what is
      # committed, so a hand-edited tokens.css or a stale daisyUI theme cannot ship.
      - run: npm run tokens:check

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # Builds every story, so a broken story fails the PR. UKIT-24 publishes this
      # output to GitHub Pages; it uploads the artifact from here rather than
      # rebuilding, so a broken build can never overwrite the live site.
      - run: npm run build-storybook

  blind-install:
    name: Blind install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Packs the kit and installs the tarball into a throwaway app outside this
      # checkout, so an undeclared dependency or a class name that never compiles to
      # CSS fails the PR instead of reaching a consumer.
      - run: npm run blind-test

  changeset:
    name: Changeset present
    # Every PR that changes the package declares its bump level at PR time
    # (UKIT-27), so the changelog writes itself and the release never guesses.
    # A docs-only change adds an empty one: npx changeset add --empty.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx changeset status --since=origin/${{ github.base_ref }}
