# Publishes Storybook to GitHub Pages (UKIT-24).
#
# Two jobs on purpose: the static build must succeed before anything is
# uploaded, so a broken story or a failed build can never overwrite the live
# site. Deploys run on every push to main; the site is
# https://unityevolv.com/unity-kit/
name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
